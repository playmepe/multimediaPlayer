<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Control de Reproducción - Multi Playlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER CON MENÚ HAMBURGUESA */
        .main-header {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Barra superior con menú y status */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            gap: 12px;
        }

        /* Botón menú hamburguesa */
        .menu-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .menu-btn:hover, .menu-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Status bar (se expande) */
        .status-bar {
            flex: 1;
            min-width: 0;
        }

        .now-playing {
            font-size: 13px;
            opacity: 0.8;
        }

        #video-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 6px;
            margin: 8px 0;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            background: #27ae60;
            border-radius: 10px;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .video-time {
            font-size: 11px;
            text-align: right;
            font-family: monospace;
        }

        /* MENÚ LATERAL (OVERLAY) */
        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            z-index: 1000;
            transition: left 0.3s ease;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .side-menu.open {
            left: 0;
        }

        /* Overlay oscuro */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
        }

        .menu-overlay.show {
            display: block;
        }

        /* Cabecera del menú */
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-header h3 {
            font-size: 18px;
        }

        .close-menu {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
        }

        /* Lista de playlists en el menú */
        .playlists-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .playlist-menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .playlist-menu-item:hover, .playlist-menu-item:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-menu-item.active {
            background: #2c3e66;
            border-left: 3px solid #27ae60;
        }

        .playlist-menu-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            word-break: break-word;
        }

        .playlist-menu-actions {
            display: flex;
            gap: 8px;
        }

        .playlist-menu-actions button {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            min-width: 36px;
        }

        .playlist-menu-actions .rename-btn:hover {
            background: #3498db;
        }

        .playlist-menu-actions .delete-btn:hover {
            background: #e74c3c;
        }

        /* Botón nueva lista en el menú */
        .new-playlist-btn {
            margin: 15px;
            background: #27ae60;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-playlist-btn:hover, .new-playlist-btn:active {
            background: #2ecc71;
        }

        /* Controles de reproducción */
        .controls {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            min-height: 44px;
            min-width: 44px;
        }

        button:hover, button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .loop-btn.active {
            background: #27ae60;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        .checkbox-container label {
            font-size: 12px;
        }

        .add-video-section {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-video-section input {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            min-height: 44px;
        }

        .add-video-section input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .add-video-section button {
            background: #3498db;
            padding: 10px 16px;
        }

        .container {
            height: calc(100vh - var(--header-height, 200px));
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .playlist {
            list-style: none;
        }

        .playlist-item {
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: move;
        }

        .playlist-item.active {
            background: #2c3e66;
            border-left: 4px solid #27ae60;
        }

        .playlist-item:hover, .playlist-item:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-item-handle {
            cursor: grab;
            opacity: 0.5;
            font-size: 20px;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        .playlist-item-path {
            font-size: 11px;
            opacity: 0.6;
            word-break: break-all;
        }

        .playlist-item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .playlist-item-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            min-width: 44px;
            min-height: 44px;
        }

        .playlist-item-btn.play:hover {
            background: #27ae60;
        }

        .playlist-item-btn.delete:hover {
            background: #e74c3c;
        }

        #filter-input {
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            min-width: 150px;
            font-size: 14px;
            min-height: 44px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .controls {
                flex-wrap: wrap;
            }

            .add-video-section {
                width: 100%;
                flex-wrap: wrap;
            }

            .add-video-section input {
                flex: 1;
                min-width: 120px;
            }

            .checkbox-container {
                margin-left: 0;
            }

            .playlist-item-btn {
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .checkbox-container {
                justify-content: center;
                margin-left: 0;
            }

            .add-video-section {
                flex-direction: column;
            }

            .add-video-section button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Menú lateral -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h3>📋 Mis Listas</h3>
            <button class="close-menu" id="closeMenuBtn">✕</button>
        </div>
        <div class="playlists-list" id="playlistsList">
            <!-- Listas se generan dinámicamente -->
        </div>
        <button class="new-playlist-btn" id="newPlaylistMenuBtn">
            ➕ Crear nueva lista
        </button>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Header principal -->
    <div class="main-header" id="header">
        <div class="top-bar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="status-bar">
                <div class="now-playing">
                    <span id="video-title">No se está reproduciendo nada</span>
                </div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="video-time" id="videoTime">00:00 / 00:00</div>
            </div>
        </div>

        <div class="controls">
            <button id="playBtn" title="Reproducir">▶</button>
            <button id="pauseBtn" title="Pausar">⏸</button>
            <button id="stopBtn" title="Detener">⏹</button>
            <button id="nextBtn" title="Siguiente">⏭</button>
            <button id="loopBtn" title="Repetir">🔁</button>

            <div class="checkbox-container">
                <input type="checkbox" id="stopCheckbox">
                <label for="stopCheckbox">MANUAL</label>
            </div>

            <div class="add-video-section">
                <input type="text" id="videoUrlInput" placeholder="URL del video o archivo">
                <input type="text" id="videoTitleInput" placeholder="Título (opcional)">
                <button id="addVideoBtn">+ Añadir</button>
            </div>

            <button id="save-playlist">💾 SAVE</button>
            <button id="load-playlist">📤 LOAD</button>
            <button id="clearPlaylistBtn">🗑 CLEAR</button>

            <button id="toggle-mode" data-mode="multimedia">Multimedia</button>

            <input type="text" id="filter-input" placeholder="🔍 Filtrar lista">
            <input type="file" id="playlist-file" accept=".json" style="display: none;">
        </div>
    </div>

    <div class="container">
        <ul class="playlist" id="playlist"></ul>
    </div>

    <script src="scripts_ctl_multilista.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoSrv</title>
    <link rel="stylesheet" href="stylesMedia.css">
    <style>
        /* Estilo para el botón de seleccionar todos */
        .select-all-container {
            margin: 10px 0;
            text-align: right;
        }
        .select-all-button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .add-all-button {
            background-color: #2196F3;
            color: white;
            padding: 8px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: -10px;
        }
        /* Ocultar checkboxes en elementos que no son videos */
        .video-item:not(.is-video) .video-checkbox {
            display: none;
        }

        /* Estilos para listas programadas */
        .toggle-scheduled-lists {
            background-color: #FF9800;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .scheduled-lists-container {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #325229;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            width: 480px;
            height:400px;
            max-height: 180vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
        }

        .scheduled-lists-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;

    flex-wrap: wrap;
    justify-content: space-evenly;
    align-items: baseline;
        }

        .scheduled-list-item {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .scheduled-list-item h4 {
            margin: 0 0 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scheduled-list-item p {
            margin: 5px 0;
            font-size: 0.9em;
        }

        .scheduled-list-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            gap: 5px;
        }

        .scheduled-list-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .scheduled-list-btn.view {
            background: #3498db;
            color: white;
        }

        .scheduled-list-btn.edit {
            background: #2ecc71;
            color: white;
        }

        .scheduled-list-btn.delete {
            background: #e74c3c;
            color: white;
        }

        .add-scheduled-list-btn {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .scheduled-list-form {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .scheduled-list-form input,
        .scheduled-list-form select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .scheduled-list-form-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* Modal de gestión de videos */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .video-management-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1001;
            overflow-y: auto;
        }

        .video-management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .video-management-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .available-videos, .list-videos {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: #f9f9f9;
        }

        .available-videos h4, .list-videos h4 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .video-list-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .video-list-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .video-list-actions {
            display: flex;
            gap: 5px;
        }

        .video-list-actions button {
            padding: 5px 10px;
            font-size: 0.8em;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .playing-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2ecc71;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #generateButton {
    background-color: #4CAF50;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-left: 2px;
}
#pagination-controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: rgba(255, 255, 255, 0.9); /* Un fondo semi-transparente para que sea visible sobre el contenido */
    z-index: 1000; /* Asegura que esté por encima de otros elementos */
    text-align: center;
    padding: 10px 0;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.1); /* Sombra para separarlo del contenido */
}
#pagination-controls {
    position: sticky;
    bottom: 0;
    background-color: #fff; /* Fondo sólido para que no se vea el contenido a través */
    z-index: 100;
    text-align: center;
    padding: 10px 0;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.1); /* Sombra para separarlo del contenido */
}
/* Estilos para el botón de toggle de imágenes */
.toggle-images-btn {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    margin: 10px 0;
    transition: background-color 0.3s;
}

.toggle-images-btn:hover {
    background: #45a049;
}

/* Estilos para la duración del video */
.video-duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}

/* Estilos para el badge de tipo de archivo */
.file-type-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: #ff9800;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
}

.video-details {
    position: relative;
    padding: 8px;
}

.video-title {
    margin-right: 80px; /* Espacio para la duración/badge */
    font-size: 14px;
    line-height: 1.3;
}

/* Diferentes estilos para imágenes vs videos */
.is-image {
    border-left: 3px solid #ff9800;
}

.is-video {
    border-left: 3px solid #4CAF50;
}
    </style>
</head>
<body>
    <header id="header">


        <section id="video-search">
            <button id="menuToggle" >☰ Menú</button>
           <!-- <button id="menuToggle" onclick="toggleMenu()">☰ Menú</button>-->
            <button id="toggleScheduledLists" class="toggle-scheduled-lists">Listas Programadas</button>

          <!--  <a>FiltrarVideos:</a>-->
            <input type="text" id="search-input" placeholder="Buscar videos...">
            <button id="generateButton2">Actualizar BD</button>
           <button id="playlistButton" hidden>Playlist</button>
           <button id="pantallaButton" hidden>Pantalla</button>
            <button id="pantallaButton2" >PantallaPri</button>
            <button id="bibliaButton" hidden>Biblia</button>



<div class="video-time" id="videoTime">00:00 / 00:00</div>
            <div class="select-all-containerxx"></div>
            <div class="status-bar">
                <div class="now-playing" id="video-title" hidden></div>
                <div class="now-playing" id="nowPlaying"></div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

            </div>
        </section>
        <nav id="sidebarMenu" class="sidebar">
  <!-- Contenido del menú -->
  <section id="menu"></section>
</nav>
    </header>

    <!-- Contenedor para listas programadas -->
    <div id="scheduledListsContainer" class="scheduled-lists-container">
        <div class="scheduled-lists-header">
            <h3>Listas Programadas</h3>
            <button id="closeScheduledLists">Cerrar</button>
            <button id="generateButton">Actualizar BD</button>
            <button id="selectAllButton" class="select-all-button">SeleccionarTodas</button>
            <button id="addSelectedButton" class="add-all-button">Añadir videos seleccionados</button>
        </div>
        <div id="scheduledLists"></div>
        <button id="addScheduledList" class="add-scheduled-list-btn">Nueva Lista Programada</button>

        <!-- Formulario para crear/editar listas programadas -->
        <div id="scheduledListForm" class="scheduled-list-form">
            <h4>Nueva Lista Programada</h4>
            <input type="text" id="listName" placeholder="Nombre de la lista">
            <input type="time" id="listTime">
            <select id="listDays">
                <option value="daily">Diariamente</option>
                <option value="weekdays">Lunes a Viernes</option>
                <option value="weekend">Fin de Semana</option>
                <option value="monday">Lunes</option>
                <option value="tuesday">Martes</option>
                <option value="wednesday">Miércoles</option>
                <option value="thursday">Jueves</option>
                <option value="friday">Viernes</option>
                <option value="saturday">Sábado</option>
                <option value="sunday">Domingo</option>
            </select>
            <div class="scheduled-list-form-buttons">
                <button id="saveScheduledList" class="scheduled-list-btn">Guardar</button>
                <button id="cancelScheduledList" class="scheduled-list-btn delete">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal para gestión de videos -->
    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="videoManagementModal" class="video-management-modal">
        <div class="video-management-header">
            <h3 id="modalListTitle">Gestionar Videos</h3>
            <button id="closeVideoModal">X</button>
        </div>
        <div class="video-management-content">
            <div class="available-videos">
                <h4>Videos Disponibles</h4>
                <div id="availableVideosList"></div>
            </div>
            <div class="list-videos">
                <h4>Videos en esta Lista</h4>
                <div id="currentListVideos"></div>
            </div>
        </div>
        <div class="modal-buttons">
            <button id="saveVideoChanges" class="scheduled-list-btn">Guardar Cambios</button>
            <button id="cancelVideoChanges" class="scheduled-list-btn delete">Cancelar</button>
        </div>
    </div>

    <main id="video-container">


        <section id="video-list" class="video-grid"></section>
       <div id="pagination-controls"></div>
    </main>
<script src="indexMediaV.js" defer></script>
<!--<script src="indexMedia.js" defer></script>-->
</body>
</html>
